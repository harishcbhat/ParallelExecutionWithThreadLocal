# SLF4J Simple provider configuration (picked up from the test classpath).
# Now that slf4j-api and slf4j-simple are aligned on 2.0.x, these settings
# actually take effect and give clean, readable framework logs.

# Default level for all loggers.
org.slf4j.simpleLogger.defaultLogLevel=info

# Readable timestamps.
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS

# Show the thread name so parallel (ThreadLocal-per-thread) execution is visible.
org.slf4j.simpleLogger.showThreadName=true

# Short logger names instead of fully-qualified class names.
org.slf4j.simpleLogger.showShortLogName=true

# Quiet down noisy third-party chatter so our own logs stand out.
org.slf4j.simpleLogger.log.io.github.bonigarcia=warn
org.slf4j.simpleLogger.log.org.openqa.selenium=warn
